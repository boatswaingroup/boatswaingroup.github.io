name: Winning-game foundation compatibility review
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out authorized source foundation
        uses: actions/checkout@v4
        with:
          repository: demtaiwo1-eng/Winning-game-
          ref: main
          path: foundation/Winning-game
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: foundation/Winning-game/eventsss123/eventsss-main/package-lock.json
      - name: Install locked dependencies
        working-directory: foundation/Winning-game/eventsss123/eventsss-main
        run: npm ci
      - name: Run API checks, web tests and KYC self-test
        working-directory: foundation/Winning-game/eventsss123/eventsss-main
        run: npm run check
      - name: Build web application
        working-directory: foundation/Winning-game/eventsss123/eventsss-main
        run: npm run build:web
      - name: Build API
        working-directory: foundation/Winning-game/eventsss123/eventsss-main
        run: npm run build
