name: Boatswain repository checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: boatswain-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: boatswain
          POSTGRES_PASSWORD: boatswain-test
          POSTGRES_DB: boatswain_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U boatswain -d boatswain_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check helper script syntax
        run: |
          bash -n scripts/import-winning-game-foundation.sh
          node --check scripts/audit-reference-site.mjs
          node --check scripts/dev.mjs
          node --check assets/estate-experience.js
          node --check assets/farm-market.js
          node scripts/test-site.mjs
      - name: Validate and build property API
        working-directory: backend
        env:
          DATABASE_URL: postgresql://boatswain:boatswain-test@127.0.0.1:5433/boatswain_test?schema=public
          JWT_SECRET: test-only-secret-with-more-than-32-characters
          NODE_ENV: test
        run: |
          npm install --no-audit --no-fund
          npx prisma validate
          npx prisma generate
          npx prisma migrate deploy
          npm run build
          npm test
      - name: Verify npm run dev starts frontend, API and PostgreSQL
        env:
          JWT_SECRET: test-only-secret-with-more-than-32-characters
        run: |
          set -euo pipefail
          setsid npm run dev > /tmp/boatswain-dev.log 2>&1 &
          DEV_PID=$!
          cleanup() {
            kill -- -"$DEV_PID" 2>/dev/null || true
            wait "$DEV_PID" 2>/dev/null || true
            docker compose down -v
          }
          trap cleanup EXIT
          READY=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null \
              && curl -fsS http://127.0.0.1:5000/health >/dev/null \
              && curl -fsS http://127.0.0.1:5000/ready >/dev/null; then
              READY=1
              break
            fi
            if ! kill -0 "$DEV_PID" 2>/dev/null; then
              cat /tmp/boatswain-dev.log
              exit 1
            fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/boatswain-dev.log
            echo "Frontend, API and PostgreSQL did not all become ready."
            exit 1
          fi
          curl -fsS http://127.0.0.1:5000/api/estates | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const v=JSON.parse(s);if(!Array.isArray(v.estates))process.exit(1)})"
          curl -fsS http://127.0.0.1:5173/ | grep -q 'content="http://localhost:5000"'
          echo "npm run dev passed: frontend :5173, API :5000 and PostgreSQL :5432 are ready."
      - name: Install browser audit dependency
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install chromium
      - name: Smoke-test Boatswain website in Chromium
        run: node scripts/smoke-test-site.mjs
      - name: Audit public Boatswain Properties website
        env:
          REFERENCE_URL: https://www.boatswainproperties.com
          MAX_PAGES: 20
          PAGE_DELAY_MS: 1200
          AUDIT_OUT: ./reference-audit
        run: node scripts/audit-reference-site.mjs
      - name: Upload browser audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boatswain-reference-audit
          path: reference-audit/
          if-no-files-found: warn
          retention-days: 14
