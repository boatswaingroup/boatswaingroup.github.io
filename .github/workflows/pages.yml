name: Deploy Boatswain Group website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare public website bundle only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-site
          cp index.html public-site/index.html
          cp 404.html public-site/404.html
          touch public-site/.nojekyll
          test ! -e public-site/backend
          test ! -e public-site/foundation
          test ! -e public-site/docs
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
