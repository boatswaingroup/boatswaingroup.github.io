services:
  - type: web
    name: boatswain-property-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install --no-audit --no-fund && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /ready
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: boatswain-property-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: boatswain-property-db
    plan: free
    region: frankfurt
    databaseName: boatswain_property
    user: boatswain_app
